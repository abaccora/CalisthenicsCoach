name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: android-apk-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache exercise videos
        id: video-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/res/raw
          key: calisthenics-videos-v1

      - name: Download exercise video library
        if: steps.video-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --disable-pip-version-check gdown==5.2.0
          python scripts/download_videos.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CalisthenicsCoach-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
