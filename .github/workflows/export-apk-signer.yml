name: Export APK signing tool

on:
  push:
    branches:
      - 'tools/apksigner-helper'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified signing helper
        run: |
          curl -L --fail --retry 3             -o uber-apk-signer.jar             https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          echo "e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835  uber-apk-signer.jar" | sha256sum -c -
      - name: Upload signing helper
        uses: actions/upload-artifact@v4
        with:
          name: uber-apk-signer-1.3.0
          path: uber-apk-signer.jar
          retention-days: 1
